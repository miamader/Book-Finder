<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookFinder | Create a Book</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="styles/navbar.css" />
  <link rel="stylesheet" href="./createbook.css" />
  <script src="components/navbar.js" defer></script>
  <script src="./createbook.js" defer></script>
</head>
<body class="cb-body">
<bf-navbar active="mybooks"></bf-navbar>

<main class="cb-main">
  <div class="cb-wrap">

    <section class="cb-cover" aria-label="Book cover upload">
      <div class="cb-cover-box">
        <div id="bookCoverPlaceholder" class="cb-cover-placeholder">
          <div class="cb-cover-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="44" height="44" fill="none">
              <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-11Z" stroke="currentColor" stroke-width="2"/>
              <path d="M9 10a2 2 0 1 0 0-4a2 2 0 0 0 0 4Z" fill="currentColor"/>
              <path d="M5.5 18l5.2-5.2a1.5 1.5 0 0 1 2.1 0L18.5 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="cb-cover-text">Add a book cover</p>
        </div>

        <img id="bookCoverPreview" class="cb-cover-preview" alt="Book cover preview" />

        <label class="cb-cover-btn">
          Upload
          <input id="bookCoverInput" type="file" accept="image/png, image/jpeg" hidden />
        </label>

        <p id="bookCoverName" class="cb-cover-text"></p>
        <button class="cb-help-dot" type="button" aria-label="Cover help">i</button>
      </div>
    </section>

    <section class="cb-card" aria-label="Book details form">
      <div class="cb-card-inner">
        <h2 class="cb-card-title">Book Details</h2>
        <div class="cb-divider"></div>

        <form class="cb-form" id="bookForm">
          <div class="cb-field">
            <label class="cb-label" for="title">Title</label>
            <input id="title" class="cb-input" type="text" placeholder="Untitled Book" maxlength="150" />
          </div>

          <div class="cb-field">
            <div class="cb-label-row">
              <label class="cb-label" for="desc">Description</label>
              <span class="cb-info" title="Tell readers what your book is about">i</span>
            </div>
            <textarea id="desc" class="cb-textarea" placeholder="Write a short summary for your book" maxlength="2400"></textarea>
          </div>

          <div class="cb-row">
            <div class="cb-field">
              <div class="cb-label-row">
                <label class="cb-label" for="category">Category</label>
                <span class="cb-info" title="Choose at least one genre">i</span>
              </div>
              <select id="category" class="cb-select">
                <option value="" selected disabled>Select a category</option>
              </select>
            </div>

            <div class="cb-field">
              <div class="cb-label-row">
                <label class="cb-label" for="series">Series</label>
                <span class="cb-info" title="Optional">i</span>
              </div>
              <select id="series" class="cb-select">
                <option value="">Standalone book</option>
              </select>
            </div>
          </div>

          <div class="cb-field">
            <div class="cb-label-row">
              <label class="cb-label" for="tagInput">Tags</label>
              <span class="cb-info" title="Add tags to help readers discover your book">i</span>
            </div>

            <div class="cb-tag-entry">
              <input id="tagInput" class="cb-input" type="text" placeholder="Add a tag and press Enter" maxlength="40" />
              <button id="addTagBtn" class="cb-plus" type="button" aria-label="Add tag">+</button>
            </div>

            <div id="tagList" class="cb-chip-list" aria-live="polite"></div>
          </div>

          <p class="cb-note">Books are created as drafts first. You can publish them after creation.</p>

          <div class="cb-actions">
            <button class="cb-next" type="submit">Create Book →</button>
          </div>
        </form>
      </div>
    </section>

  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Chapter Reader</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reader.css" />
    <script src="chapter-reader.js" defer></script>
</head>

<body>

<main class="reader-shell">

    <!-- Top bar -->
    <div class="reader-topbar">
        <button id="backBtn" class="reader-btn">← Back</button>

        <div class="reader-title">
            <h2 id="chapterTitle">Loading...</h2>
        </div>

        <div class="reader-controls">
            <button id="prevBtn" class="reader-btn">Prev</button>
            <button id="nextBtn" class="reader-btn">Next</button>
        </div>
    </div>

    <!-- Book spread -->
    <div class="reader-spread">

        <section id="leftPage" class="reader-page"></section>

        <div class="reader-divider"></div>

        <section id="rightPage" class="reader-page"></section>

    </div>

</main>

</body>
</html>

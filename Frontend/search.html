<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Finder | Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- styles -->
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/navbar.css" />

    <link rel="stylesheet" href="search.css"/>
    <!-- components -->
    <script src="components/navbar.js" defer></script>
</head>
 
<body>
 
  <bf-navbar active="browse"></bf-navbar>
 
  <div class="page-wrap">
 
    <!-- page heading and search bar -->
    <div class="search-header">
      <h1 class="search-page-title">Search</h1>
      <div class="search-bar-wrap">
        <svg class="sb-icon" viewBox="0 0 24 24" width="16" height="16" fill="none">
          <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2"/>
          <path d="M16.2 16.2L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="mainSearchInput" class="search-bar-input" type="text"
               placeholder="Search for Books"
               onkeydown="if(event.key==='Enter') applySearch()"/>
      </div>
    </div>
 
    <div class="content-row">
 
      <!-- --SIDEBAR FILTERS-- -->
      <aside class="filters">
        <div class="filter-top">
          <span class="filter-label">Filter Option</span>
          <button class="reset-btn" onclick="resetFilters()">Reset All</button>
        </div>
 
        <!-- date posted -->
        <div class="filter-group">
          <div class="filter-group-header red">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
              <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
              <path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Posted at
          </div>
          <label class="radio-row"><input type="radio" name="posted" value=""      checked> All</label>
          <label class="radio-row"><input type="radio" name="posted" value="today">        Today</label>
          <label class="radio-row"><input type="radio" name="posted" value="week">         This week</label>
          <label class="radio-row"><input type="radio" name="posted" value="month">        This month</label>
          <label class="radio-row"><input type="radio" name="posted" value="year">         This year</label>
          <label class="radio-row"><input type="radio" name="posted" value="previous">     Previous Years</label>
        </div>
 
        <!-- genre filter -->
        <div class="filter-group">
          <div class="filter-group-header red">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                    stroke="currentColor" stroke-width="2"/>
            </svg>
            Genre
          </div>
          <label class="check-row"><input type="checkbox" name="genre" value=""        class="genre-all" onchange="handleGenreAll(this)"> All</label>
          <label class="check-row"><input type="checkbox" name="genre" value="1"       class="genre-opt"> Fiction</label>
          <label class="check-row"><input type="checkbox" name="genre" value="2"       class="genre-opt"> Fantasy</label>
          <label class="check-row"><input type="checkbox" name="genre" value="3"       class="genre-opt"> Science Fiction</label>
          <label class="check-row"><input type="checkbox" name="genre" value="4"       class="genre-opt"> Historical</label>
          <label class="check-row"><input type="checkbox" name="genre" value="5"       class="genre-opt"> Horror</label>
        </div>
 
        <!-- author name -->
        <div class="filter-group">
          <div class="filter-group-header red">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
              <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Author
          </div>
          <input id="authorInput" class="author-input" type="text" placeholder="Author's name"
                 onkeydown="if(event.key==='Enter'){ addAuthorChip(this.value); this.value=''; }"/>
          <div class="chip-row" id="authorChips"></div>
        </div>
 
        <!-- rating -->
        <div class="filter-group">
          <div class="filter-group-header red">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            Rating
          </div>
          <label class="radio-row"><input type="radio" name="rating" value=""  checked> All</label>
          <label class="radio-row"><input type="radio" name="rating" value="5"> 5 stars</label>
          <label class="radio-row"><input type="radio" name="rating" value="4"> 4 stars</label>
          <label class="radio-row"><input type="radio" name="rating" value="3"> 3 stars</label>
          <label class="radio-row"><input type="radio" name="rating" value="2"> 2 stars</label>
          <label class="radio-row"><input type="radio" name="rating" value="1"> 1 star</label>
        </div>
 
        <!-- length/amount of parts -->
        <div class="filter-group">
          <div class="filter-group-header red">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
              <circle cx="12" cy="12" r="10"/>
            </svg>
            Amount of Parts
          </div>
          <label class="check-row"><input type="checkbox" name="parts" value=""    class="parts-all" onchange="handlePartsAll(this)"> All</label>
          <label class="check-row"><input type="checkbox" name="parts" value="short" class="parts-opt"> Short Reads (&lt;5)</label>
          <label class="check-row"><input type="checkbox" name="parts" value="medium" class="parts-opt"> Medium Reads (5-15)</label>
          <label class="check-row"><input type="checkbox" name="parts" value="long"  class="parts-opt"> Long Reads (15+)</label>
        </div>
 
        <button class="apply-btn" onclick="applySearch()">Apply Filters</button>
      </aside>
 
      <!-- --SEARCH RESULTS-- -->
      <main class="results-area">
        <div class="results-header">
          <span class="results-label">Books</span>
          <span class="results-count" id="resultsCount"></span>
        </div>
 
        <!-- book grid populated by search.js -->
        <div class="book-grid" id="bookGrid">
          <!-- placeholders for when results are loading-->
          <div class="book-card skeleton"></div>
          <div class="book-card skeleton"></div>
          <div class="book-card skeleton"></div>
          <div class="book-card skeleton"></div>
          <div class="book-card skeleton"></div>
          <div class="book-card skeleton"></div>
          <div class="book-card skeleton"></div>
          <div class="book-card skeleton"></div>
        </div>
 
        <!-- state when there are no books available for that search -->
        <div class="empty-state" id="emptyState" style="display:none">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none">
            <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="#ccc" stroke-width="1.5"/>
            <path d="M16.2 16.2L21 21" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <p>No books found. Try a different search or filter.</p>
        </div>
 
        <div class="pagination" id="pagination"></div>
      </main>
 
    </div>
  </div>
 
  <script src="./search.js"></script>
</body>
</html>
